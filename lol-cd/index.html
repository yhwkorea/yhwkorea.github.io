<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>스킬쿨 물어보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 한 화면 도구: 위=마이크·입력, 가운데=읽어준 답, 아래=그 챔피언 4스킬 표 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#17202b; --muted:#5d6b7a; --line:#d5dbe2;
  --accent:#0f6b8f; --accent-fg:#ffffff; --warn:#a65300; --warn-bg:#fdf0e1; --ok:#1d7a46;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#17202b; --fg:#e6ebf0; --muted:#93a1b0; --line:#2a3644;
  --accent:#4cb3d9; --accent-fg:#06202b; --warn:#f0a95a; --warn-bg:#2d2214; --ok:#5cc98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#17202b; --fg:#e6ebf0; --muted:#93a1b0; --line:#2a3644;
  --accent:#4cb3d9; --accent-fg:#06202b; --warn:#f0a95a; --warn-bg:#2d2214; --ok:#5cc98a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700}
.ver{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ask{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:stretch}
#mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
#mic[data-state="listening"]{outline:4px solid color-mix(in srgb,var(--accent) 35%,transparent)}
#mic:focus-visible,#q:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:flex;gap:8px;min-width:0}
#q{flex:1;min-width:0;font:inherit;font-size:18px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
form button{font:inherit;font-weight:600;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:0}
#answer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:19px;font-weight:600;min-height:3em}
#answer.warn{border-color:var(--warn);background:var(--warn-bg)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
td.k{font-family:var(--mono);font-weight:500;width:2em}
td.cd{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hit td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin-top:4px}
.chip.ok{color:var(--ok)} .chip.chk{color:var(--warn)}
.sub{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted)}
#cards{display:grid;gap:8px}
details.sk{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.sk[open]{border-color:var(--accent)}
details.sk>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:2em 1fr;gap:2px 8px;align-items:baseline}
details.sk>summary::-webkit-details-marker{display:none}
summary .k{font-family:var(--mono);font-weight:500;color:var(--accent);grid-row:span 2}
summary .nm{font-weight:600;min-width:0}
summary .cd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;min-width:0;overflow-wrap:anywhere}
.skb{padding:0 12px 12px;display:grid;gap:8px;min-width:0}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lv{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.lv li{display:grid;grid-template-columns:1.2em 1fr;gap:4px;overflow-wrap:anywhere}
.lv .m{font-weight:700} .lv .m.y{color:var(--ok)} .lv .m.n{color:var(--muted)}
.desc{font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.desc p{margin:0 0 6px}
.lab{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
/* 워치(작은 원형 화면): 머리말·안내 숨기고 답과 표만 */
@media (max-width:330px){
  .wrap{padding-block:12% 18%;padding-left:max(10%,env(safe-area-inset-left,0px));padding-right:max(10%,env(safe-area-inset-right,0px));gap:10px}
  header,.hint,footer,.row{display:none}
  #q{font-size:16px;padding:8px 10px} form button{padding:0 10px}
  #answer{font-size:15px;padding:10px} .desc,.lv{font-size:13px} details.sk>summary{padding:8px}
}
</style>

<div class="wrap">
  <header>
    <h1>스킬쿨 물어보기</h1>
    <span class="ver" id="ver"></span>
  </header>

  <div class="ask">
    <button id="mic" type="button" hidden>말하기</button>
    <form id="f">
      <input id="q" type="search" autocomplete="off" placeholder="예: 드레이븐 E 쿨" aria-label="질문">
      <button type="submit">찾기</button>
    </form>
  </div>
  <p class="hint" id="hint">키보드의 마이크 버튼으로 말해도 됩니다. 챔피언 + 스킬 키(패시브, Q W E R, 궁) 로 물어보세요.</p>

  <div id="answer" aria-live="polite">예시: "드레이븐 E" 를 물으면 쿨과 핵심 수치를 읽어 줍니다.</div>

  <div class="row">
    <label><input type="checkbox" id="speak" checked> 답을 소리로 읽기</label>
    <span id="status"></span>
  </div>

  <div id="cards"></div>

  <footer>숫자는 이 페이지에 들어 있는 표에서만 나옵니다. 쿨 출처: 게임 파일·Data Dragon과 LoL Wiki 대조. 설명·수치: LoL Wiki 원문(영어). ✓ = 같은 숫자 줄이 게임 파일에도 있음, · = 게임 파일에서 못 찾음(계산값 등). 스킬 가속 0 기준.</footer>
</div>

post-mitigation damage dealt, capped at Sleepy Trouble Bubble's damage.","Sleepy Trouble Bubble refunds a percentage of its cooldown if the bubble hits an enemy champion."],"수치":[{"줄":"Magic Damage: 70 / 110 / 150 / 190 / 230 (+ 45% AP)","게임확인":true},{"줄":"Maximum Slow: 10 / 15 / 20 / 25 / 30%","게임확인":true},{"줄":"Bonus Damage Cap: 70 / 110 / 150 / 190 / 230 (+ 45% AP)","게임확인":true},{"줄":"Maximum Mixed Damage: 140 / 220 / 300 / 380 / 460 (+ 90% AP)","게임확인":false},{"줄":"Cooldown Refund: 16 / 19.5 / 23 / 26.5 / 30%","게임확인":true}],"비용":"80 Mana","사거리":"800 + 50"}],"R":[{"이름":"Portal Jump","설명":["Active: After a 0.15-second delay, Zoe blinks in the target direction and remains there for 0.95 seconds to 1.25 seconds, during which she sets her movement speed to a static 0 and has unobstructed vision. Afterwards, she blinks back to her casting position.","Portal Jump resets Zoe's basic attack timer. Zoe briefly becomes unable to act after casting Portal Jump as well as after blinking back."],"수치":[],"비용":"40 Mana","사거리":"575"}]}},"Zyra":{"패시브":"가시 정원","스킬":{"P":[{"이름":"Garden of Thorns","설명":["Innate: Periodically, Zyra spawns one or two Seeds nearby that last for 30 seconds, granting sight over the surrounding area for 1 second.","After 1 second, enemy champions can destroy Seeds by moving on top of them.","Zyra can only have a total of 8 Seeds planted at a time, preserving Seeds spawned by Rampant Growth over Seeds spawned by Garden of Thorns."],"수치":[],"비용":"","사거리":"900"}],"Q":[{"이름":"Deadly Spines","설명":["Active: Zyra sprouts thorny spines at the target location that appear after a 0.625-seconds delay, dealing magic damage to enemies hit.","If Deadly Spine hits a Seed, it sprouts into a Thorn Spitter that lasts for 8 seconds."],"수치":[{"줄":"Magic Damage: 60 / 100 / 140 / 180 / 220 (+ 65% AP)","게임확인":true}],"비용":"55 mana","사거리":"800"}],"W":[{"이름":"Rampant Growth","설명":["Active: Zyra plants a Seed at the target location that remains for 60 seconds and grants sight over the surrounding area, though decreasing in radius after 1 second. After 1.5 seconds, enemy champions can destroy the Seed by stepping on it, which reveals them for 2 seconds.","Zyra periodically stocks a Seed charge, up to a maximum of 2. Killing an enemy generates 35% charge toward a Seed, increased to 100% for large enemies and whenever scoring an enemy champion takedown."],"수치":[],"비용":"1 Seed","사거리":"850"}],"E":[{"이름":"Grasping Roots","설명":["Active: Zyra shoots a surge of vines in the target direction that deals magic damage to enemies hit and roots them for a duration.","If Grasping Roots hits a Seed, it sprouts into a Vine Lasher that lasts for 8 seconds."],"수치":[{"줄":"Magic Damage: 60 / 95 / 130 / 165 / 200 (+ 60% AP)","게임확인":true},{"줄":"Root Duration: 1 / 1.25 / 1.5 / 1.75 / 2 seconds","게임확인":true}],"비용":"70 / 75 / 80 / 85 / 90 Mana","사거리":"1100 • 1200"}],"R":[{"이름":"Stranglethorns","설명":["Active: Zyra summons a monstrous thicket at the target location that deals magic damage to enemies hit as it expands.","After 2 seconds, the thicket snaps upward to knock up enemies within for 1 second.","Plants hit by the thicket become enraged, restoring 50% of their current health, increasing their maximum health by 50%, gaining 25% increased size and refreshing their duration while the thicket expands. Additionally they attack in a flurry, launching two shots per attack, dealing 「 150% damage per flurry. 」「 75% damage per shot. 」"],"수치":[{"줄":"Magic Damage: 200 / 300 / 400 (+ 70% AP)","게임확인":true}],"비용":"100 Mana","사거리":"700"}]}}}};
const KEYS = ["P","Q","W","E","R"];
const norm = s => s.toLowerCase().replace(/[\s.'’:·!?,~\-]/g,"");
const byChamp = new Map();
for (const r of DATA.스킬){ if(!byChamp.has(r.챔피언)) byChamp.set(r.챔피언,[]); byChamp.get(r.챔피언).push(r); }
const champs = [...byChamp.keys()];
const ALIAS = {"블츠":"블리츠크랭크","케틀":"케이틀린","트타":"트리스타나","미포":"미스 포츈","블라디":"블라디미르","문도":"문도 박사","트페":"트위스티드 페이트","마이":"마스터 이","말파":"말파이트","아트":"아트록스","세주":"세주아니","이렐":"이렐리아","카직":"카직스","헤카":"헤카림","노틸":"노틸러스","레오나":"레오나","쓰레쉬":"쓰레쉬","쓰레시":"쓰레쉬","탐켄":"탐 켄치","트런들":"트런들","람머":"람머스","오리":"오리아나","신짜오":"신 짜오","카서":"카서스","갱플":"갱플랭크","아펠":"아펠리오스","케넨":"케넨","르블":"르블랑","이즈":"이즈리얼","루시":"루시안","카이":"카이사"};
const champNorm = champs.map(c=>[norm(c),c]).concat(Object.entries(ALIAS).map(([a,c])=>[norm(a),c])).filter(([,c])=>byChamp.has(c)).sort((a,b)=>b[0].length-a[0].length);

document.getElementById("ver").textContent = "클라이언트 "+DATA.버전+" · "+DATA.수집일+" 수집";

function findChamp(text){
  const t = norm(text);
  for (const [n,c] of champNorm) if (t.includes(n)) return {champ:c, rest:t.replace(n," ")};
  return null;
}
function findKey(rest, champ){
  const rs = byChamp.get(champ);
  for (const r of rs){ for (const part of r.스킬.split(/ \/ | \| /)) if (part.length>1 && rest.includes(norm(part))) return r.키; }
  if (/패시브|기본지속|(^|[^a-z])p($|[^a-z])/.test(rest)) return "P";
  if (/궁|궁극기|얼티|울트|(^|[^a-z])r($|[^a-z])|알스킬|알쿨/.test(rest)) return "R";
  if (/큐|(^|[^a-z])q($|[^a-z])/.test(rest)) return "Q";
  if (/더블유|더블|(^|[^a-z])w($|[^a-z])/.test(rest)) return "W";
  if (/(^|[^a-z])e($|[^a-z])|이스킬|이쿨|^\s*이\s*$|^\s*이(?=쿨)/.test(rest)) return "E";
  return null;
}
function sayNums(cd){ const v=cd.split("/"); return v.every(x=>x===v[0]) ? v[0] : v.join(", "); }
function descOf(champ){ const id=byChamp.get(champ)[0].id; return DESC.챔피언[id]; }
function core(champ, key, n=2){
  const f=(descOf(champ).스킬[key]||[])[0]; if(!f) return "";
  return f.수치.slice(0,n).map(l=>l.줄.replace(/\//g,",")).join(". ");
}
function sentence(r){
  let s = `${r.챔피언} ${r.키}, ${r.스킬}. `;
  if (r.쿨==="확인 필요") s += "쿨은 출처끼리 값이 달라서 확정 못 했어요. " + r.대조 + ". ";
  else if (r.충전) s += `충전식이고 충전 시간 ${sayNums(r.충전)}초. 연속 사용 간격 ${sayNums(r.쿨)}초. `;
  else s += `쿨 ${sayNums(r.쿨)}초. `;
  const c=core(r.챔피언, r.키); if (c) s += c + ".";
  return s;
}
function passiveSentence(champ){
  const d=descOf(champ); const c=core(champ,"P");
  return `${champ} 패시브, ${d.패시브}. ` + (c ? c+"." : "자세한 설명은 화면에 있어요.");
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function renderCards(champ, key){
  const box=document.getElementById("cards"); box.textContent="";
  const d=descOf(champ); const rs=byChamp.get(champ);
  for (const slot of ["P","Q","W","E","R"]){
    const r = rs.find(x=>x.키===slot);
    const det=el("details","sk"); if (slot===key) det.open=true;
    const sum=el("summary");
    sum.append(el("span","k",slot==="P"?"P":slot), el("span","nm", slot==="P" ? d.패시브 : r.스킬));
    let cdText = slot==="P" ? "패시브" : (r.쿨==="확인 필요" ? "쿨 확인 필요" : "쿨 "+r.쿨+(r.충전?` · 충전 ${r.충전}`:""));
    sum.append(el("span","cd",cdText));
    det.append(sum);
    const body=el("div","skb");
    if (r && r.대조!=="일치") body.append(el("div","meta","쿨 대조: "+r.대조));
    if (r && r.비고) body.append(el("div","meta","쿨 비고: "+r.비고));
    for (const f of (d.스킬[slot]||[])){
      if ((d.스킬[slot]||[]).length>1) body.append(el("div","lab",f.이름));
      const meta=[f.비용&&("비용 "+f.비용), f.사거리&&("사거리 "+f.사거리)].filter(Boolean).join(" · ");
      if (meta) body.append(el("div","meta",meta));
      if (f.수치.length){
        const ul=el("ul","lv");
        for (const l of f.수치){ const li=el("li"); li.append(el("span","m "+(l.게임확인?"y":"n"), l.게임확인?"✓":"·"), el("span",null,l.줄)); ul.append(li); }
        body.append(ul);
      }
      if (f.설명.length){
        const dv=el("div","desc"); dv.append(el("div","lab","위키 원문"));
        for (const p of f.설명) dv.append(el("p",null,p));
        body.append(dv);
      }
    }
    det.append(body); box.append(det);
  }
}
function speak(text){
  if (!document.getElementById("speak").checked || !("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=1.15; speechSynthesis.speak(u);}catch(e){}
}
function show(text, warn){
  const a=document.getElementById("answer"); a.textContent=text; a.classList.toggle("warn",!!warn); speak(text);
}
function answerFor(champ, key){
  renderCards(champ, key);
  const rs = byChamp.get(champ);
  if (key==="P"){ show(passiveSentence(champ), false); return; }
  if (key){ const r=rs.find(x=>x.키===key); show(sentence(r), r.대조!=="일치"); }
  else show(rs.map(r=>`${r.키} ${r.쿨==="확인 필요"?"확인 필요":sayNums(r.쿨)}`).join(". ")+"초.", rs.some(r=>r.대조!=="일치") && false);
  if (!key) document.getElementById("answer").textContent = `${champ}: ` + document.getElementById("answer").textContent;
}
let samplePromise = null;
async function guessWithClaude(text){
  const sample = await (samplePromise ??= window.claude?.use ? claude.use("sample") : Promise.resolve(null));
  if (!sample) return null;
  const prompt = `리그 오브 레전드 챔피언 스킬 쿨을 묻는 말을 음성 인식으로 받아 적은 글이다. 받아 적기가 틀렸을 수 있다.
아래 목록에서 어떤 챔피언을 말한 건지, 어떤 스킬 키(P=패시브, Q/W/E/R, 궁=R)인지 고르라. 숫자는 절대 말하지 마라.
JSON만 답하라: {"champion": 목록의 이름 그대로 또는 null, "key": "P"|"Q"|"W"|"E"|"R"|null}
챔피언 목록: ${champs.join(", ")}
받아 적은 글: ${text}`;
  try { return await sample.json(prompt, {modelTier:"quick"}); } catch(e){ return null; }
}
async function handle(text){
  text=text.trim(); if(!text) return;
  const st=document.getElementById("status");
  const m = findChamp(text);
  if (m){ answerFor(m.champ, findKey(m.rest, m.champ)); st.textContent=""; return; }
  st.textContent="이름을 못 찾아서 Claude에게 물어보는 중…";
  const g = await guessWithClaude(text);
  st.textContent="";
  if (g && g.champion && byChamp.has(g.champion)){
    answerFor(g.champion, KEYS.includes(g.key)?g.key:null);
    st.textContent=`"${text}" → ${g.champion} 로 알아들음`;
  } else show(`"${text}" 에서 챔피언 이름을 못 찾았어요. 이름을 다시 말해 주세요.`, true);
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault(); handle(document.getElementById("q").value);});
// 키보드 음성 입력으로 글자가 들어오면 엔터 없이도 찾기 (챔피언 이름이 들어 있을 때만)
let typingTimer=null;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(typingTimer);
  const v=e.target.value; if(!findChamp(v)) return;
  typingTimer=setTimeout(()=>handle(v),700);
});

// 첫 화면: 예시
renderCards("드레이븐","E");

// 말하기 버튼 (지원되는 브라우저에서만 보임)
(async()=>{
  const d = window.claude?.use ? await claude.use("dictation") : null;
  if (!d) return;
  const mic=document.getElementById("mic"), q=document.getElementById("q");
  mic.hidden=false;
  document.getElementById("hint").textContent="말하기를 누르고 \"드레이븐 E 쿨\" 처럼 말한 뒤 다시 누르세요.";
  let buf="";
  d.onPartial(({text})=>{ if(text) q.value=(buf+text).trim(); });
  d.onFinal(({text})=>{ buf+=text; q.value=buf.trim(); });
  d.onState(({state,reason})=>{
    mic.dataset.state=state;
    mic.textContent = state==="idle" ? "말하기" : state==="listening" ? "멈추기" : "…";
    if (state==="idle"){
      if (buf.trim()) handle(buf); buf="";
      if (reason==="not_granted"||reason==="unavailable"){ mic.hidden=true; document.getElementById("hint").textContent="마이크를 쓸 수 없어요. 키보드의 마이크 버튼으로 말해 주세요."; }
    }
  });
  mic.addEventListener("click",()=>{
    if (d.active()){ d.stop(); return; }
    buf=""; q.value="";
    d.start({language:"ko"}).catch(err=>{ if(err?.code==="not_granted"||err?.code==="unavailable"){mic.hidden=true;} document.getElementById("status").textContent = err?.code==="not_granted"?"마이크 권한이 꺼져 있어요.":""; });
  });
})();
